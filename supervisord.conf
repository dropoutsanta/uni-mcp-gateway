[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

# Expose a unix socket so `supervisorctl` works inside the container.
# Required by llm_proxy._litellm_post_respawn_hook to reload litellm
# config after a RunPod auto-respawn changes the upstream api_base.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:bridge-default]
command=bash -c "mkdir -p /data/store && exec /app/whatsapp-bridge"
directory=/app/bridge-default
environment=PORT="7481",WHATSAPP_BRIDGE_API_KEY="%(ENV_WHATSAPP_BRIDGE_API_KEY)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10
startsecs=5

[program:bridge-second]
command=bash -c "mkdir -p /data/store2 && exec /app/whatsapp-bridge"
directory=/app/bridge-second
environment=PORT="7482",WHATSAPP_BRIDGE_API_KEY="%(ENV_WHATSAPP_BRIDGE_API_KEY)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10
startsecs=5

[program:xvfb]
command=Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp
autorestart=true
priority=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# Optional: LiteLLM behind the wake-aware /llm proxy. Uses
# /app/litellm-config.yaml if present, otherwise the example config.
[program:litellm]
command=bash -c "cfg=/app/litellm-config.yaml; [ -f $cfg ] || cfg=/app/litellm-config.example.yaml; exec litellm --config $cfg --host 127.0.0.1 --port 4000 --num_workers 1"
directory=/app
environment=LITELLM_LOG="INFO"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10

[program:gateway]
command=python /app/main.py
directory=/app
environment=DISPLAY=":99",MCP_PORT="8080",MCP_AUTH_TOKEN="%(ENV_MCP_AUTH_TOKEN)s",MCP_BASE_URL="%(ENV_MCP_BASE_URL)s",GATEWAY_DB_PATH="/data/gateway.db",WHATSAPP_DB_PATH="/data/store/messages.db",WHATSAPP_BRIDGE_URL="http://localhost:7481",WHATSAPP_BRIDGE_API_KEY="%(ENV_WHATSAPP_BRIDGE_API_KEY)s",OAUTH_STATE_PATH="/data/oauth_state.json",RESULTS_DIR="/data/results",SLACK_APP_TOKEN="%(ENV_SLACK_APP_TOKEN)s",LITELLM_PROXY_URL="http://127.0.0.1:4000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=10
startsecs=3
